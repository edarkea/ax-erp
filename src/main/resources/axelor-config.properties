# Aplicación
application.name=ERP
application.description=Enterprise Resource Planning
application.version=1.0.0
application.mode=dev
application.theme=auto
application.locale=es
# Exportaciones
data.export.locale=es
data.export.encoding=UTF-8
# Seguridad y cifrado
encryption.password=QUNTAHZXNTJZBPHMEZKSVVAKTEKQJEPSGDKGGQA
encryption.algorithm=GCM
# PostgreSQL
db.default.driver=org.postgresql.Driver
db.default.ddl=update
db.default.url=jdbc:postgresql://localhost:5432/mi_axelor_app
db.default.user=axelor
db.default.password=axelor
# Pool de conexiones
hibernate.hikari.minimumIdle=2
hibernate.hikari.maximumPoolSize=10
hibernate.hikari.idleTimeout=300000
# Sesión
session.timeout=60
# Archivos
data.upload.dir={user.home}/.axelor/mi-app/attachments
data.upload.max-size=10
data.upload.allowlist.pattern=\\.(xml|xlsx|xls|csv|jpg|jpeg|png|pdf|doc|docx)$
data.upload.blocklist.pattern=\\.(exe|dll|bat|cmd|ps1|sh|js|svg)$
# API
application.openapi.enabled=true
application.swagger-ui.enabled=true
# Logs
logging.level.root=INFO
logging.level.com.axelor=INFO
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=INFO
#cache
jakarta.persistence.sharedCache.mode=ENABLE_SELECTIVE
data.import.demo-data=false